server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing -- without this, refreshing
    # on e.g. /dashboard or /workflows/abc123 hits nginx directly, which
    # has no such file and would 404. Fall back to index.html and let
    # the app's own router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
