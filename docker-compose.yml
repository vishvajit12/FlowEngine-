services:
  mongodb:
    image: mongo:6.0
    container_name: flowengine-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowengine-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: flowengine-api
    restart: unless-stopped
    command: ["node", "index.js"]
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      # Inside Docker's network, services reach each other by service
      # name, not localhost -- these two override whatever's in .env
      # for the containerized case specifically.
      MONGO_URI: mongodb://mongodb:27017/flowengine
      REDIS_HOST: redis
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    container_name: flowengine-worker
    restart: unless-stopped
    command: ["node", "worker.js"]
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/flowengine
      REDIS_HOST: redis
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: flowengine-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo-data:
  redis-data:
